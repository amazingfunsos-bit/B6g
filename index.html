/* Layout: teal velvet banner holding the throne logo, then a grid of big game tiles (the "throne room"). */
:root{
  --bg:#EEF4F2; --card:#FFFFFF; --ink:#13231F; --muted:#56706A; --line:#C9D9D4;

  --f-d:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-b:"Rubik",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1513; --card:#13211E; --ink:#E6F1EE; --muted:#93ADA6; --line:#26403A;
  --velvet:#0C3F43; --velvet-ink:#F6FBF9; --gold:#F4B92F; --gold-dk:#B9861A; --ruby:#EE5D70; --leaf:#22B25C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1513; --card:#13211E; --ink:#E6F1EE; --muted:#93ADA6; --line:#26403A;
  --velvet:#0C3F43; --velvet-ink:#F6FBF9; --gold:#F4B92F; --gold-dk:#B9861A; --ruby:#EE5D70; --leaf:#22B25C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5}
.band{background:var(--velvet);color:var(--velvet-ink);padding-block:22px 26px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(circle at 12% 20%,rgba(244,185,47,.18) 0 2px,transparent 3px),radial-gradient(circle at 70% 70%,rgba(244,185,47,.14) 0 2px,transparent 3px);background-size:46px 46px,58px 58px}
.band-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{width:clamp(104px,26vw,140px);height:auto;flex:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.28))}
.logo .wig{transform-origin:64px 22px;animation:wig 3s ease-in-out infinite}
.logo .blink{transform-origin:64px 56px;animation:blink 4.5s infinite}
@keyframes wig{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-3px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.brand{min-width:0}
.brand h1{font-family:var(--f-d);font-weight:400;font-size:clamp(40px,10vw,68px);line-height:.95;margin:0;letter-spacing:.005em;text-wrap:balance}
.brand h1 span{color:var(--gold)}
.brand p{margin:6px 0 0;font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.share-hub{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 14px var(--f-b);border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.wa{background:var(--leaf);border-color:var(--leaf);color:#fff}
.band .btn{background:transparent;color:var(--velvet-ink);border-color:rgba(246,251,249,.4)}
.band .btn:hover{border-color:var(--velvet-ink)}
.band .btn.wa{background:var(--leaf);border-color:var(--leaf)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

main{max-width:1080px;margin:0 auto;padding-block:22px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
main h2{font-family:var(--f-d);font-weight:400;font-size:26px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.game{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.play{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--ink);border-radius:16px;padding:14px 8px 12px;background:var(--tint);transition:transform .15s}
.play:hover{transform:translateY(-3px)}
.play svg{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 18px -6px rgba(0,0,0,.35)}
.play b{font-family:var(--f-d);font-weight:400;font-size:21px;line-height:1.1;text-align:center;text-wrap:balance}
.play .go{font:600 13px var(--f-b);letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--card);padding:6px 16px;border-radius:99px}
.link{font-size:13px;color:var(--muted);text-align:center;margin:0;overflow-wrap:anywhere}
.row{display:flex;gap:8px}
.row .btn{flex:1 1 0;padding:8px 10px;font-size:13px;min-height:40px}
.soon{border-style:dashed;justify-content:center;align-items:center;text-align:center;color:var(--muted);min-height:200px}
.soon b{font-family:var(--f-d);font-weight:400;font-size:20px;color:var(--ink)}
.btn.demo{background:var(--gold);border-color:var(--gold-dk);color:#13231F;width:100%}
.vmodal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.vmodal[hidden]{display:none}
.vbox{width:min(960px,100%);display:flex;flex-direction:column;gap:10px}
.vbox video{width:100%;border-radius:14px;background:#000;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.vbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{min-height:20px;margin:0;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.logo .wig,.logo .blink{animation:none}.play{transition:none}}
</style>

/* sound */
let ac=null;
function tone(freqs,dur=.09,type='triangle',vol=.16){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    let t=ac.currentTime;freqs.forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);t+=dur*.8;});
  }catch(e){}
}
const sfx={play:()=>tone([523,659,784,1047],.1),share:()=>tone([660,880],.07),copy:()=>tone([880,1175],.07)};

/* toast & copy */
const toast=document.getElementById('toast');let tt;
function say(m){toast.textContent=m;clearTimeout(tt);tt=setTimeout(()=>toast.textContent='',2600);}
function copy(text){
  sfx.copy();
  const done=()=>say('Link copied: '+text);
  try{navigator.clipboard.writeText(text).then(done,fallback);}catch(e){fallback();}
  function fallback(){const i=document.createElement('input');i.value=text;document.body.appendChild(i);i.select();try{document.execCommand('copy')}catch(e){}i.remove();done();}
}
const wa=(msg,link)=>'https://wa.me/?text='+encodeURIComponent(msg+' '+link);

/* grid */
const grid=document.getElementById('grid');
GAMES.forEach(g=>{
  const link='https://is.gd/'+g.slug;
  const el=document.createElement('section');el.className='game';
  el.innerHTML=`<a class="play" style="--tint:${g.tint}" href="${link}" target="_blank" rel="noopener">
      <svg viewBox="0 0 48 48" aria-hidden="true">${g.icon}</svg><b>${g.name}</b><span class="go">Play</span></a>
    <p class="link">is.gd/${g.slug}</p>
    <div class="row"><a class="btn wa" href="${wa('Play '+g.name+'!',link)}" target="_blank" rel="noopener">WhatsApp</a>
    <button class="btn" type="button" data-copy="${link}">Copy link</button></div>${g.demo?'<button class="btn demo" type="button" data-demo="1">▶ See demo (1 min)</button>':''}`;
  grid.appendChild(el);
});
const soon=document.createElement('section');soon.className='game soon';
soon.innerHTML='<b>More games coming</b><span>New ones get a seat on the throne here.</span>';
grid.appendChild(soon);

const darkQ=matchMedia('(prefers-color-scheme: dark)');
function tintFix(){const th=document.documentElement.dataset.theme;const dark=th==='dark'||(th!=='light'&&darkQ.matches);
  document.querySelectorAll('.play').forEach(a=>a.style.background=dark?'color-mix(in srgb, '+a.style.getPropertyValue('--tint')+' 14%, transparent)':'');}
tintFix();try{darkQ.addEventListener('change',tintFix);new MutationObserver(tintFix).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}

const hubWa=document.getElementById('hubWa');
hubWa.href=wa('Game Throne: all our games in one place 👑',HUB_LINK);
hubWa.addEventListener('click',sfx.share);
document.getElementById('hubCopy').onclick=()=>copy(HUB_LINK);
const closeV=()=>{const v=document.getElementById('vid');try{v.pause()}catch(_){}document.getElementById('vmodal').hidden=true;};
document.getElementById('vclose').onclick=closeV;document.getElementById('vmodal').addEventListener('click',e=>{if(e.target.id==='vmodal')closeV();});
grid.addEventListener('click',e=>{
  if(e.target.closest('[data-demo]')){sfx.play();const m=document.getElementById('vmodal'),v=document.getElementById('vid');m.hidden=false;try{v.currentTime=0;v.play().catch(()=>{})}catch(_){}return;}
  const b=e.target.closest('[data-copy]');if(b){copy(b.dataset.copy);return;}
  if(e.target.closest('.play'))sfx.play();else if(e.target.closest('.wa'))sfx.share();
});
})();
</script>
